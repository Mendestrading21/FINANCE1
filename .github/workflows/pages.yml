name: Deploy Finance to GitHub Pages
on:
  workflow_dispatch:
# Déclenchement manuel uniquement : GitHub Pages est confirmé indisponible
# tant que ce dépôt reste privé sur le forfait actuel (voir docs/STATUS.md,
# section Hébergement — erreur exacte "Resource not accessible by
# integration" en créant le site Pages). Repasser sur "push: branches:
# [main]" une fois le dépôt public ou le forfait mis à niveau.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
